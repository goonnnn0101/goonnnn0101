  .mute { fill: #a3a199; } .dim { fill: #6d6e73; } .mono { font-family: 'SF Mono', Menlo, Consolas, 'Courier New', monospace; }
  .ch { fill: url(#chrome); }
  .ic { fill: none; stroke: url(#line); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ic .fc { fill: url(#line); stroke: none; } .ic .fe { fill: #0b0b0d; }
