<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 140" width="840" height="140" role="img" aria-label="Stack: TypeScript, React, Next.js, Node.js, Prisma, SQLite, Electron, PixiJS, Tailwind CSS, Vitest, Playwright">
<defs>
