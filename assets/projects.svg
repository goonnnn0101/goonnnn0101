<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 612" width="840" height="612" role="img" aria-label="Projects: Commerce Admin Lab (research lab) — A lab for researching how e-commerce companies really operate. It analyses public data from Shopify stores to map the processes, tools and methodologies they use. AiProvid (ai saas) — AI video SaaS: a text prompt becomes a professional animated video. Product app with authentication, plus an animated waitlist landing page. Metadata Cleaner (privacy tool · open source) — Browser-only tool that strips metadata from Word, Excel, PowerPoint, PDF and image files: author, dates, EXIF, GPS, C2PA. Nothing is uploaded; it all runs locally. Cursor Caído (game) — 2D sandbox game where your real Windows desktop is the world: open windows become platforms. Pixel art and chiptune audio are generated in code.">
<defs>
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="0.32" stop-color="#c3c7ce"/><stop offset="0.5" stop-color="#666b73"/>
    <stop offset="0.53" stop-color="#f1f2f4"/><stop offset="0.82" stop-color="#b1b6be"/><stop offset="1" stop-color="#70757d"/>
  </linearGradient>
  <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fafafa"/><stop offset="0.22" stop-color="#9da2a9"/><stop offset="0.42" stop-color="#e9eaec"/>
