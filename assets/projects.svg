<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 554" width="840" height="554" role="img" aria-label="Projects: Commerce Admin Lab (Research lab) — A lab for researching how e-commerce companies really operate. It analyses public data from Shopify stores to map the processes, tools and methodologies they use. AiProvid (AI SaaS) — AI video SaaS: a text prompt becomes a professional animated video. Product app with authentication, plus an animated waitlist landing page. Metadata Cleaner (Privacy tool · open source) — Browser-only tool that strips metadata from Word, Excel, PowerPoint, PDF and image files: author, dates, EXIF, GPS, C2PA. Nothing is uploaded; it all runs locally. Cursor Caído (Game) — 2D sandbox game where your real Windows desktop is the world: open windows become platforms. Pixel art and chiptune audio are generated in code.">
